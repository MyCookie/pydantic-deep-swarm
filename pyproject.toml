[project]
name = "agent-team"
version = "0.1.0"
description = "Local Agent Team Runtime - Multi-agent orchestration with Pydantic AI"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai[openai]>=2.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.28.0",
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "click>=8.0.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
agent-team = "agent_team.cli:main"

[build-system]
requires = ["uv_build==0.12.21"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.2,<8",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.coverage.run]
branch = true
source = ["agent_team"]
relative_files = true
omit = []

[tool.coverage.report]
include_namespace_packages = true

[tool.agent-team.coverage]
# Measured on Linux, 2026-10-02: 6231/7461 lines and 1530/2228 branches.
# These floors ratchet that baseline; they are not a claim of 95% coverage.
line-floor = 83.50
branch-floor = 68.60
target = 95.0
scope = "pytest-interpreter"
